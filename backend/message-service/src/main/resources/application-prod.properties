# =============================================================================
# MESSAGE SERVICE
# =============================================================================
spring.application.name=message-service
server.port=${SERVER_PORT_MESSAGE_SERVICE}

# =============================================================================
# DATABASE
# =============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${MESSAGE_DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT}

# =============================================================================
# JPA
# =============================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# EUREKA
# =============================================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# =============================================================================
# INTERNAL SERVICE SECURITY
# =============================================================================
internal.security.service-key=${INTERNAL_SERVICE_KEY}

# =============================================================================
# RABBITMQ
# =============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
#spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# =============================================================================
# JWT
# =============================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# =============================================================================
# WEBSOCKET
# =============================================================================
spring.websocket.servlet.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =============================================================================
# ACTUATOR
# =============================================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

# =============================================================================
# LOGGING
# =============================================================================
logging.level.root=INFO
logging.level.com.office_management=INFO