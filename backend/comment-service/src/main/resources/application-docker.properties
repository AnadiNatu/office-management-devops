# =============================================================================
# COMMENT SERVICE
# =============================================================================

spring.application.name=comment-service

server.port=${SERVER_PORT:8084}


# =============================================================================
# DATABASE
# =============================================================================

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/OfficeManagementDB}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}

spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}


# =============================================================================
# JPA
# =============================================================================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=false


# =============================================================================
# EUREKA
# =============================================================================

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

eureka.instance.instance-id=${spring.application.name}:${server.port}


# =============================================================================
# INTERNAL SERVICE SECURITY
# =============================================================================

internal.security.service-key=${INTERNAL_SERVICE_KEY}


# =============================================================================
# RABBITMQ
# =============================================================================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}

spring.rabbitmq.port=${RABBITMQ_PORT:5672}

spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}

spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}


# =============================================================================
# JWT
# =============================================================================

jwt.secret=${JWT_SECRET}

jwt.expiration=${JWT_EXPIRATION:86400000}


# =============================================================================
# ACTUATOR
# =============================================================================

management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.show-details=when_authorized


# =============================================================================
# LOGGING
# =============================================================================

logging.level.root=INFO

logging.level.com.office_management=INFO
