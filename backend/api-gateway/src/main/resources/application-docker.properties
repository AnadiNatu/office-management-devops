# =============================================================================
# API GATEWAY
# =============================================================================
spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# =============================================================================
# EUREKA
# =============================================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# =============================================================================
# GATEWAY DISCOVERY
# =============================================================================
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# =============================================================================
# CORS
# =============================================================================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# =============================================================================
# JWT
# =============================================================================
jwt.secret=${JWT_SECRET}

# =============================================================================
# ACTUATOR
# =============================================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.health.eureka.enabled=true

# =============================================================================
# LOGGING
# =============================================================================
logging.level.root=INFO
logging.level.com.office_management=INFO